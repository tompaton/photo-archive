[project]
name = "photo-archive-v3"
version = "0.1.0"
description = "Simple local photo review and NAS archiving"
requires-python = ">=3.15"
dependencies = ["ExifRead>=3.5", "textual>=6.12", "tree-sitter>=0.25", "tree-sitter-json>=0.24", "Pillow>=12"]

[project.scripts]
photo-archive-v3 = "photo_archive_v3.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = ["pytest>=9", "ruff>=0.17", "ty>=0.0.88"]

[tool.ruff]
target-version = "py315"
[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "PTH", "C901", "ANN"]
ignore = ["ANN401"]
[tool.ruff.lint.mccabe]
max-complexity = 10
[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ANN"]
[tool.ty.environment]
python-version = "3.15"
[tool.pytest.ini_options]
testpaths = ["tests"]
